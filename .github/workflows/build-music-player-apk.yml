name: Build Luma Music APK

on:
  push:
    paths:
      - 'music-player/**'
      - '.github/workflows/build-music-player-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: music-player
        run: gradle --no-daemon assembleDebug

      - name: Prepare direct-download APK
        run: cp music-player/app/build/outputs/apk/debug/app-debug.apk Luma-Music.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Music-debug-APK
          path: Luma-Music.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luma-latest
          name: Luma Music Player - Latest APK
          body: |
            Latest automatically built Luma Music Player debug APK.
            This is a debug build, not a Play Store-signed release.
          files: Luma-Music.apk
          overwrite_files: true
          make_latest: true
